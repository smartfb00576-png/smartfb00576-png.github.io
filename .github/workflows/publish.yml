name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A9416E: ${{ secrets.A9416E }}
          B768C4: ${{ secrets.B768C4 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A9416E', ''), os.environ.get('B768C4', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 90ba3fc75046da347f4c08 -->', a)
          if b:
              patched = patched.replace('<!-- 30aba20fb528d9cc2156c0ec875fa471ba2299a294 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
